name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node scripts/verify-release-tag.mjs $env:GITHUB_REF_NAME
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Build Windows update artifacts
        run: npx electron-builder --win nsis --publish never
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          release/Tmail-Setup-*.exe
          release/Tmail-Setup-*.exe.blockmap
          release/latest.yml
          --verify-tag
          --title "Tmail $env:GITHUB_REF_NAME"
          --generate-notes

